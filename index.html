<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFRA Panel – Finans Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--panel:#fff;--ink:#14171f;--muted:#6b7280;--line:#e5e7eb;
  --brand:#c8102e;--brand-ink:#fff;--side:#111827;--side-ink:#d1d5db;
  --ok:#0f9d58;--warn:#d97706;--bad:#dc2626;--info:#2563eb;
  --okbg:#e7f6ee;--warnbg:#fdf3e2;--badbg:#fdeaea;--infobg:#e8effd;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f14;--panel:#151a22;--ink:#e6e8ec;--muted:#9aa3b2;--line:#252c38;--side:#090b10;
  --okbg:#10291c;--warnbg:#2c2210;--badbg:#2e1414;--infobg:#121f3a;}}
:root[data-theme="dark"]{--bg:#0c0f14;--panel:#151a22;--ink:#e6e8ec;--muted:#9aa3b2;--line:#252c38;--side:#090b10;
  --okbg:#10291c;--warnbg:#2c2210;--badbg:#2e1414;--infobg:#121f3a;}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.logo b{background:var(--brand);color:#fff;border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
/* layout */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
aside .logo{color:#fff;margin:0 6px 22px}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%;color:var(--side-ink)}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(200,16,46,.18);color:#fff}
.nav .badge{margin-left:auto;background:var(--brand);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
aside .foot{margin-top:auto;font-size:12px;padding:8px 6px;border-top:1px solid rgba(255,255,255,.08)}
main{padding:22px 28px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
.top h1{font-size:20px;margin:0;margin-right:auto}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.s{padding:4px 10px;min-height:30px;font-size:13px}
.grid{display:grid;gap:16px}
.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.k2{grid-template-columns:2fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:24px;font-weight:600;margin-top:6px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap}
.kritik,.hata,.cikis{background:var(--badbg);color:var(--bad)}
.uyari,.kismi,.bekliyor,.planlandi{background:var(--warnbg);color:var(--warn)}
.bilgi,.yolda{background:var(--infobg);color:var(--info)}
.basarili,.teslim_edildi,.giris,.ok{background:var(--okbg);color:var(--ok)}
.iade,.iptal{background:var(--line);color:var(--muted)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:28px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:13px}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.form label.f{grid-column:1/-1}
.form .ctl{color:var(--ink)}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:99;max-width:360px}
.mtop{display:none}
.alert{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border-bottom:0}
.alert .t{font-weight:500}.alert .s{color:var(--muted);font-size:12.5px;margin-top:2px}
.alert .a{margin-left:auto;text-align:right;white-space:nowrap}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:240px;z-index:50;transform:translateX(-100%);transition:.2s}
  aside.open{transform:none}
  .mtop{display:inline-flex}
  main{padding:16px}
  .k4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .k2{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
}
</style>
</head>
<body>

<section id="login" class="hidden">
  <div class="lcard">
    <div class="logo"><b>A</b> AFRA Panel</div>
    <p class="hint" style="margin:10px 0 22px">Arçelik AX günlük kasa, sevkiyat ve finans takip sistemi</p>
    <form id="lform" class="form" style="grid-template-columns:1fr">
      <label>Kullanıcı adı<input class="ctl" type="text" id="luser" required autocomplete="username" autocapitalize="none"></label>
      <label>Şifre<input class="ctl" type="password" id="lpass" required autocomplete="current-password"></label>
      <button class="btn p" type="submit" id="lbtn">Giriş yap</button>
      <div id="lmsg" class="hint">Hesabınız yoksa yöneticinizden kullanıcı adı ve şifre isteyin.</div>
    </form>
  </div>
</section>

<div id="app" class="hidden">
  <aside id="side">
    <div class="logo"><b>A</b> AFRA Panel</div>
    <button class="nav on" data-v="ozet">📊 Genel Bakış</button>
    <button class="nav" data-v="kasa">💰 Günlük Kasa</button>
    <button class="nav" data-v="sevk">🚚 Sevkiyat</button>
    <button class="nav" data-v="finans">📈 Finansal Raporlar</button>
    <button class="nav" data-v="denetim">🛡️ Denetim <span class="badge hidden" id="nbadge"></span></button>
    <button class="nav" data-v="aktarim">🔄 AX Aktarımları</button>
    <button class="nav yon" data-v="kullanicilar">👥 Kullanıcılar</button>
    <button class="nav yon" data-v="yonetim">🏢 Şubeler</button>
    <div class="foot"><div id="uname"></div><div id="urol" style="opacity:.7"></div>
      <button class="nav" id="sifrem" style="padding:8px 0">🔑 Şifremi değiştir</button>
      <button class="nav" id="tema" style="padding:8px 0">🌓 Tema</button>
      <button class="nav" id="cikis" style="padding:8px 0">↩ Çıkış</button></div>
  </aside>
  <main>
    <div class="top">
      <button class="btn mtop" id="menu">☰</button>
      <h1 id="title">Genel Bakış</h1>
      <select class="ctl" id="fsube"></select>
      <input class="ctl" type="date" id="fbas">
      <input class="ctl" type="date" id="fbit">
    </div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg"><form method="dialog" id="dform"><h3 id="dtitle" style="margin:0 0 16px"></h3><div class="form" id="dbody"></div>
<div class="acts"><button class="btn" value="cancel" formnovalidate>Vazgeç</button><button class="btn p" value="ok" id="dok">Kaydet</button></div></form></dialog>

<script>
const SB_URL='https://drgnnlewwnwshwvpoljy.supabase.co';
const SB_KEY='sb_publishable_YpFFWDyHNFm2UF_L-Bdfyg_owoDrKbG';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const TL=new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const tl=v=>v==null?'–':TL.format(+v)+' ₺';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const fdate=d=>d?new Date(d+'T00:00').toLocaleDateString('tr-TR'):'–';
const LBL={giris:'Giriş',cikis:'Çıkış',nakit:'Nakit',kredi_karti:'Kredi kartı',havale:'Havale/EFT',cek:'Çek',senet:'Senet',diger:'Diğer',
 bekliyor:'Bekliyor',planlandi:'Planlandı',yolda:'Yolda',teslim_edildi:'Teslim edildi',iade:'İade',iptal:'İptal',
 satis_fatura:'Satış faturası',tahsilat:'Tahsilat',alis_fatura:'Alış faturası',odeme:'Ödeme',
 kritik:'Kritik',uyari:'Uyarı',bilgi:'Bilgi',basarili:'Başarılı',kismi:'Kısmi',hata:'Hata',ax:'AX',manuel:'Manuel'};
const pill=v=>`<span class="pill ${esc(v)}">${esc(LBL[v]||v)}</span>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
let ME=null,SUBELER=[],VIEW='ozet',charts=[];
const isYon=()=>ME?.rol==='yonetici';

/* ---------- auth ---------- */
const DOMAIN='afra-panel.local';
const normUser=u=>String(u||'').trim().toLocaleLowerCase('tr').replace(/ı/g,'i').replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s').replace(/ö/g,'o').replace(/ç/g,'c');
$('#lform').onsubmit=async e=>{e.preventDefault();$('#lmsg').textContent='Giriş yapılıyor…';$('#lbtn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:normUser($('#luser').value)+'@'+DOMAIN,password:$('#lpass').value});
  $('#lbtn').disabled=false;
  $('#lmsg').textContent=error?(/banned/i.test(error.message)?'Hesabınız pasif durumda. Yöneticinize başvurun.':'Kullanıcı adı veya şifre hatalı.'):'';};
$('#cikis').onclick=()=>sb.auth.signOut();
async function yonet(body){const {data,error}=await sb.functions.invoke('kullanici-yonet',{body});
  if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}return data}
$('#sifrem').onclick=async()=>{const o=await form('Şifremi değiştir',[{k:'s1',l:'Yeni şifre',t:'password',req:true,full:true},{k:'s2',l:'Yeni şifre (tekrar)',t:'password',req:true,full:true}]);
  if(!o)return;if(o.s1!==o.s2)return toast('Şifreler aynı değil');if(String(o.s1).length<6)return toast('Şifre en az 6 karakter olmalı');
  const {error}=await sb.auth.updateUser({password:o.s1});toast(error?error.message:'Şifreniz değiştirildi')};
$('#tema').onclick=()=>{const r=document.documentElement,c=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=c;try{localStorage.setItem('tema',c)}catch(e){}};
try{const t=localStorage.getItem('tema');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#menu').onclick=()=>$('#side').classList.toggle('open');

sb.auth.onAuthStateChange((_e,s)=>{s?boot(s.user):(ME=null,$('#app').classList.add('hidden'),$('#login').classList.remove('hidden'))});

async function boot(user){
  const {data:p}=await sb.from('profiller').select('*').eq('id',user.id).single();
  ME=p||{rol:'sube',email:user.email};
  $('#login').classList.add('hidden');$('#app').classList.remove('hidden');
  $('#uname').textContent=ME.ad_soyad||ME.kullanici_adi;$('#urol').textContent=isYon()?'Yönetici':'Şube kullanıcısı';
  document.querySelectorAll('.yon').forEach(n=>n.classList.toggle('hidden',!isYon()));
  await loadSubeler();
  if(!$('#fbas').value){const d=new Date();d.setDate(d.getDate()-29);$('#fbas').value=iso(d);$('#fbit').value=today();}
  render();
}
async function loadSubeler(){
  const {data}=await sb.from('subeler').select('*').order('ad');SUBELER=data||[];
  const cur=$('#fsube').value;
  $('#fsube').innerHTML=(isYon()||SUBELER.length>1?'<option value="">Tüm şubeler</option>':'')+SUBELER.map(s=>`<option value="${s.id}">${esc(s.ad)}</option>`).join('');
  if(cur)$('#fsube').value=cur;
}
const subeAd=id=>SUBELER.find(s=>s.id===id)?.ad||'–';
document.querySelectorAll('.nav[data-v]').forEach(n=>n.onclick=()=>{VIEW=n.dataset.v;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x===n));$('#side').classList.remove('open');render()});
['#fsube','#fbas','#fbit'].forEach(s=>$(s).onchange=render);

function q(t,sel='*',dateCol='tarih'){let r=sb.from(t).select(sel);const s=$('#fsube').value;if(s)r=r.eq('sube_id',s);
  if(dateCol)r=r.gte(dateCol,$('#fbas').value).lte(dateCol,$('#fbit').value);return r}
function chart(el,cfg){const c=new Chart(el,cfg);charts.push(c);return c}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

async function render(){
  charts.forEach(c=>c.destroy());charts=[];
  const T={ozet:'Genel Bakış',kasa:'Günlük Kasa',sevk:'Sevkiyat Takibi',finans:'Finansal Raporlar',denetim:'Denetim & Kontroller',aktarim:'AX Aktarımları',yonetim:'Şubeler',kullanicilar:'Kullanıcılar'};
  $('#title').textContent=T[VIEW];$('#view').innerHTML='<div class="empty">Yükleniyor…</div>';
  if(!SUBELER.length&&!['yonetim','kullanicilar'].includes(VIEW)){$('#view').innerHTML=`<div class="card empty">${isYon()?'Henüz şube tanımlı değil. <br><br><button class="btn p" onclick="VIEW=\'yonetim\';render()">Şube ekle</button>':'Hesabınıza henüz bir şube atanmadı. Yöneticinizle iletişime geçin.'}</div>`;return}
  try{await V[VIEW]()}catch(e){console.error(e);$('#view').innerHTML=`<div class="card empty">Hata: ${esc(e.message)}</div>`}
  refreshBadge();
}
async function refreshBadge(){const {data}=await sb.rpc('denetim_kontrolleri',{p_tarih:today()});
  const n=(data||[]).filter(a=>a.seviye==='kritik').length;$('#nbadge').textContent=n;$('#nbadge').classList.toggle('hidden',!n)}

/* ---------- dialog helper ---------- */
function form(title,fields,vals={}){return new Promise(res=>{
  $('#dtitle').textContent=title;
  $('#dbody').innerHTML=fields.map(f=>{const v=vals[f.k]??f.d??'';const cls=f.full?'f':'';
    if(f.t==='select')return `<label class="${cls}">${f.l}<select class="ctl" name="${f.k}" ${f.req?'required':''}>${f.o.map(o=>{const[val,lab]=Array.isArray(o)?o:[o,LBL[o]||o];return `<option value="${esc(val)}" ${val==v?'selected':''}>${esc(lab)}</option>`}).join('')}</select></label>`;
    if(f.t==='textarea')return `<label class="f">${f.l}<textarea class="ctl" name="${f.k}" rows="2">${esc(v)}</textarea></label>`;
    return `<label class="${cls}">${f.l}<input class="ctl" name="${f.k}" type="${f.t||'text'}" ${f.t==='number'?'step="0.01"':''} value="${esc(v)}" ${f.req?'required':''}></label>`}).join('');
  const d=$('#dlg');d.returnValue='';d.showModal();
  d.onclose=()=>{if(d.returnValue!=='ok')return res(null);const o={};new FormData($('#dform')).forEach((v,k)=>o[k]=v===''?null:v);res(o)};
})}
const subeField=()=>({k:'sube_id',l:'Şube',t:'select',req:true,o:SUBELER.map(s=>[s.id,s.ad]),d:$('#fsube').value||ME.sube_id||SUBELER[0]?.id});

/* ---------- views ---------- */
const V={};

V.ozet=async()=>{
  const [kg,sv,al,ch]=await Promise.all([q('v_kasa_gunluk'),q('v_sevkiyat_gunluk'),sb.rpc('denetim_kontrolleri',{p_tarih:today()}),q('cari_hareketler','tarih,tur,tutar')]);
  const K=kg.data||[],S=sv.data||[],A=(al.data||[]).filter(a=>!$('#fsube').value||a.sube_id===$('#fsube').value),C=ch.data||[];
  const sum=(a,k)=>a.reduce((x,r)=>x+(+r[k]||0),0);
  const ciro=C.filter(c=>c.tur==='satis_fatura').reduce((x,r)=>x+ +r.tutar,0), tah=C.filter(c=>c.tur==='tahsilat').reduce((x,r)=>x+ +r.tutar,0);
  const bek=sum(S,'bekleyen')+sum(S,'yolda');
  const krit=A.filter(a=>a.seviye==='kritik').length;
  const days=[...new Set(K.map(r=>r.tarih))].sort();
  $('#view').innerHTML=`
  <div class="grid k4">
    <div class="card kpi"><div class="l">Kasa girişi</div><div class="v num">${tl(sum(K,'toplam_giris'))}</div><div class="d">Çıkış: ${tl(sum(K,'toplam_cikis'))}</div></div>
    <div class="card kpi"><div class="l">Satış (fatura)</div><div class="v num">${tl(ciro)}</div><div class="d">Tahsilat: ${tl(tah)}</div></div>
    <div class="card kpi"><div class="l">Sevkiyat</div><div class="v num">${sum(S,'toplam')}</div><div class="d">${sum(S,'teslim')} teslim · ${bek} açık</div></div>
    <div class="card kpi"><div class="l">Denetim uyarısı</div><div class="v num ${krit?'neg':''}">${A.length}</div><div class="d">${krit} kritik</div></div>
  </div>
  <div class="grid k2" style="margin-top:16px">
    <div class="card"><h3>Günlük kasa hareketi</h3><div style="height:260px"><canvas id="c1"></canvas></div></div>
    <div class="card"><h3>Öncelikli uyarılar</h3><div id="alist"></div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Şube bazında özet</h3><div class="tw"><table><thead><tr><th>Şube</th><th class="r">Kasa giriş</th><th class="r">Kasa çıkış</th><th class="r">Nakit net</th><th class="r">Sevkiyat</th><th class="r">Açık sevkiyat</th><th class="r">Uyarı</th></tr></thead><tbody>
  ${SUBELER.filter(s=>!$('#fsube').value||s.id===$('#fsube').value).map(s=>{const k=K.filter(r=>r.sube_id===s.id),v=S.filter(r=>r.sube_id===s.id);
   return `<tr><td>${esc(s.ad)}</td><td class="r num">${tl(sum(k,'toplam_giris'))}</td><td class="r num">${tl(sum(k,'toplam_cikis'))}</td><td class="r num">${tl(sum(k,'nakit_net'))}</td><td class="r num">${sum(v,'toplam')}</td><td class="r num">${sum(v,'bekleyen')+sum(v,'yolda')}</td><td class="r">${A.filter(a=>a.sube_id===s.id).length}</td></tr>`}).join('')}
  </tbody></table></div></div>`;
  $('#alist').innerHTML=alertList(A.sort((a,b)=>rank(a)-rank(b)).slice(0,7));
  const agg=d=>K.filter(r=>r.tarih===d);
  chart($('#c1'),{type:'bar',data:{labels:days.map(fdate),datasets:[
    {label:'Giriş',data:days.map(d=>sum(agg(d),'toplam_giris')),backgroundColor:'#0f9d58',borderRadius:4},
    {label:'Çıkış',data:days.map(d=>sum(agg(d),'toplam_cikis')),backgroundColor:'#c8102e',borderRadius:4}]},
    options:chartOpts()});
};
const rank=a=>({kritik:0,uyari:1,bilgi:2}[a.seviye]);

LBL.satis_fatura='Satış';
async function axIncele(batch){
  const {data:R,error}=await sb.rpc('ax_onizle',{p_batch:batch});if(error)return toast(error.message);
  const S=R.filter(r=>r.tip==='satis'),O=R.filter(r=>r.tip==='odeme');
  const top=(a,f)=>a.filter(f).reduce((x,r)=>x+ +r.tutar,0);
  const yeni=R.filter(r=>!r.mevcut&&r.tur!=='vadeli').length,eslesmez=R.filter(r=>!r.sube_id).length;
  const ozet=SUBELER.map(s=>{const a=S.filter(r=>r.sube_id===s.id),b=O.filter(r=>r.sube_id===s.id);if(!a.length&&!b.length)return'';
   return `<tr><td>${esc(s.ad)}</td><td class="r num">${a.filter(r=>r.tur==='satis_fatura').length}</td><td class="r num">${tl(top(a,r=>r.tur==='satis_fatura'))}</td><td class="r num">${tl(top(a,r=>r.tur==='iade'))}</td><td class="r num">${tl(top(b,r=>r.tur==='giris')-top(b,r=>r.tur==='cikis'))}${top(b,r=>r.tur==='vadeli')?`<div class="hint">+ ${tl(top(b,r=>r.tur==='vadeli'))} vadeli</div>`:''}</td></tr>`}).join('');
  const satir=r=>`<tr style="${r.mevcut||r.tur==='vadeli'?'opacity:.5':''}"><td>${r.tur==='vadeli'?'Vadeli (VAD) <span class="hint">kasaya işlenmez</span>':esc(r.tip==='satis'?(LBL[r.tur]||r.tur):LBL[r.odeme_tipi]||r.odeme_tipi)}${r.iptal?' <span class="pill kritik">iptal</span>':''}</td><td>${r.sube_id?esc(subeAd(r.sube_id)):'<span class="pill kritik">şube yok</span>'}</td>
   <td>${esc(r.cari||'')}</td><td class="hint">${esc(r.belge||'')} ${esc(r.aciklama||'')}</td><td class="r num ${r.tur==='iade'||r.tur==='cikis'?'neg':''}">${tl(r.tutar)}</td><td>${r.mevcut?'<span class="hint">zaten var</span>':''}</td></tr>`;
  const d=document.createElement('dialog');d.style.width='min(1000px,calc(100vw - 32px))';
  d.innerHTML=`<h3 style="margin:0 0 6px">AX aktarımı — ${esc(batch)}</h3><p class="hint" style="margin:0 0 14px">${yeni} yeni kayıt eklenecek${R.length-yeni?`, ${R.length-yeni} kayıt zaten sistemde (tekrar yazılmaz)`:''}${eslesmez?`. <b class="neg">${eslesmez} satırın şubesi bulunamadı, bunlar eklenmez.</b>`:''}</p>
   <div class="tw"><table><thead><tr><th>Şube</th><th class="r">Satış adedi</th><th class="r">Satış tutarı</th><th class="r">İade / iptal</th><th class="r">Kasa tahsilatı (net)</th></tr></thead><tbody>${ozet||'<tr><td colspan="5" class="empty">Kayıt yok</td></tr>'}</tbody></table></div>
   <h3 style="margin:18px 0 6px">Satırlar (${R.length})</h3><div class="tw" style="max-height:45vh;overflow:auto"><table><thead><tr><th>Tür</th><th>Şube</th><th>Müşteri</th><th>Belge / Açıklama</th><th class="r">Tutar</th><th></th></tr></thead><tbody>${R.map(satir).join('')}</tbody></table></div>
   <div class="acts"><button class="btn" data-k="kapat">Kapat</button><button class="btn" data-k="reddet">Reddet</button><button class="btn p" data-k="onayla">Onayla ve kasaya işle</button></div>`;
  document.body.appendChild(d);d.showModal();d.onclose=()=>d.remove();
  d.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{const k=b.dataset.k;if(k==='kapat')return d.close();
    if(k==='reddet'&&!confirm('Bu aktarım reddedilsin mi? Kasaya hiçbir şey yazılmaz.'))return;
    b.disabled=true;const {data:res,error}=await sb.rpc('ax_onayla',{p_batch:batch,p_karar:k});
    if(error){b.disabled=false;return toast(error.message)}
    d.close();toast(k==='reddet'?'Aktarım reddedildi':`Kasaya işlendi: ${res.satis} satış, ${res.odeme} ödeme`);render()});
}

  $('#cexp').onclick=()=>xlsxOut(C.map(r=>({Tarih:r.tarih,Şube:subeAd(r.sube_id),'Cari kod':r.cari_kod,Cari:r.cari_ad,Tür:LBL[r.tur],Belge:r.belge_no,Vade:r.vade_tarihi,Tutar:+r.tutar})),'cari');
  $('#cimp').onclick=()=>importFile('cari_hareketler',{tarih:['tarih','date'],cari_kod:['cari kod','cari kodu','hesap'],cari_ad:['cari','cari adı','müşteri','ad'],tur:['tür','tur','işlem'],tutar:['tutar','amount'],belge_no:['belge','fatura no','belge no'],vade_tarihi:['vade','vade tarihi']});
};

   ${SUBELER.map(s=>`<tr><td class="num">${esc(s.kod)}</td><td>${esc(s.ad)}</td><td>${esc(s.sehir||'')}</td><td class="num">${esc(s.ax_bayi_kodu||'')}</td><td><button class="btn s" onclick="editSube('${s.id}')">Düzenle</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Şube yok</td></tr>'}
   </tbody></table></div><button class="btn p" style="margin-top:12px" onclick="editSube()">+ Şube ekle</button></div></div>`;

V.kullanicilar=async()=>{
  const {data:all=[]}=await sb.from('profiller').select('*').order('created_at');
  const f=window._kf||{q:'',rol:'',sube:''};
  const P=all.filter(p=>(!f.q||normUser((p.ad_soyad||'')+' '+(p.kullanici_adi||'')).includes(normUser(f.q)))&&(!f.rol||p.rol===f.rol)&&(!f.sube||(f.sube==='-'?!p.sube_id:p.sube_id===f.sube)));
  const say=x=>all.filter(x).length;
  $('#view').innerHTML=`
  <div class="grid k4">
   <div class="card kpi"><div class="l">Toplam kullanıcı</div><div class="v num">${all.length}</div></div>
   <div class="card kpi"><div class="l">Yönetici</div><div class="v num">${say(p=>p.rol==='yonetici')}</div></div>
   <div class="card kpi"><div class="l">Şube kullanıcısı</div><div class="v num">${say(p=>p.rol==='sube')}</div><div class="d">${say(p=>p.rol==='sube'&&!p.sube_id)} kişiye şube atanmamış</div></div>
   <div class="card kpi"><div class="l">Pasif hesap</div><div class="v num">${say(p=>!p.aktif)}</div></div>
  </div>
  <div class="tabs" style="margin-top:16px">
   <input class="ctl" id="kq" placeholder="Ad veya kullanıcı adı ara" value="${esc(f.q)}" style="flex:1;min-width:180px">
   <select class="ctl" id="krol"><option value="">Tüm roller</option><option value="yonetici" ${f.rol==='yonetici'?'selected':''}>Yönetici</option><option value="sube" ${f.rol==='sube'?'selected':''}>Şube kullanıcısı</option></select>
   <select class="ctl" id="ksube"><option value="">Tüm şubeler</option><option value="-" ${f.sube==='-'?'selected':''}>Şube atanmamış</option>${SUBELER.map(s=>`<option value="${s.id}" ${f.sube===s.id?'selected':''}>${esc(s.ad)}</option>`).join('')}</select>
   <button class="btn p" onclick="kullaniciEkle()">+ Kullanıcı ekle</button>
  </div>
  <div class="grid" style="grid-template-columns:1fr">
   <div class="card"><h3>Kullanıcılar (${P.length})</h3><p class="hint">Kullanıcı adı ve şifreyi kişiye siz iletirsiniz. Şube kullanıcıları yalnızca atandıkları şubenin verisini görür.</p>
   <div class="tw"><table><thead><tr><th>Kullanıcı</th><th>Rol</th><th>Şube</th><th>Durum</th><th></th></tr></thead><tbody>
   ${P.length?'':'<tr><td colspan="5" class="empty">Aramaya uyan kullanıcı yok</td></tr>'}
   ${P.map(p=>{const ben=p.id===ME.id;return `<tr><td><div style="font-weight:500">${esc(p.ad_soyad||p.kullanici_adi)}</div><div class="hint num">${esc(p.kullanici_adi||'')}</div></td>
    <td><select class="ctl" ${ben?'disabled':''} onchange="setProf('${p.id}',{rol:this.value})"><option value="sube" ${p.rol==='sube'?'selected':''}>Şube</option><option value="yonetici" ${p.rol==='yonetici'?'selected':''}>Yönetici</option></select></td>
    <td><select class="ctl" onchange="setProf('${p.id}',{sube_id:this.value||null})"><option value="">– Şube –</option>${SUBELER.map(s=>`<option value="${s.id}" ${s.id===p.sube_id?'selected':''}>${esc(s.ad)}</option>`).join('')}</select></td>
    <td>${p.aktif?'<span class="pill ok">Aktif</span>':'<span class="pill iade">Pasif</span>'}</td>
    <td style="white-space:nowrap"><button class="btn s" onclick="sifreSifirla('${p.id}','${esc(p.kullanici_adi)}')">Şifre</button>
     ${ben?'':`<button class="btn s" onclick="durumDegis('${p.id}',${!p.aktif})">${p.aktif?'Pasif yap':'Aktif yap'}</button> <button class="btn s" onclick="kullaniciSil('${p.id}','${esc(p.kullanici_adi)}')">Sil</button>`}</td></tr>`}).join('')}
   </tbody></table></div></div></div>`;
  const setF=()=>{window._kf={q:$('#kq').value,rol:$('#krol').value,sube:$('#ksube').value};render()};
  $('#krol').onchange=setF;$('#ksube').onchange=setF;
  let t;$('#kq').oninput=()=>{clearTimeout(t);t=setTimeout(()=>{setF();setTimeout(()=>{const i=$('#kq');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}},60)},400)};
};
async function kullaniciEkle(){const o=await form('Yeni kullanıcı',[{k:'ad_soyad',l:'Ad soyad',req:true},{k:'kullanici_adi',l:'Kullanıcı adı',req:true},
  {k:'sifre',l:'Şifre (en az 6 karakter)',t:'text',req:true},{k:'rol',l:'Rol',t:'select',o:[['sube','Şube kullanıcısı'],['yonetici','Yönetici']]},
  {k:'sube_id',l:'Şube',t:'select',o:[['','– Şube –'],...SUBELER.map(s=>[s.id,s.ad])],full:true}]);if(!o)return;
  try{await yonet({islem:'olustur',...o});toast(`"${normUser(o.kullanici_adi)}" oluşturuldu`);render()}catch(e){toast(e.message)}}
async function sifreSifirla(id,ka){const o=await form(`${ka} – yeni şifre`,[{k:'sifre',l:'Yeni şifre (en az 6 karakter)',t:'text',req:true,full:true}]);if(!o)return;
  try{await yonet({islem:'sifre',id,sifre:o.sifre});toast('Şifre güncellendi')}catch(e){toast(e.message)}}
async function durumDegis(id,aktif){try{await yonet({islem:'durum',id,aktif});toast(aktif?'Hesap aktif':'Hesap pasif yapıldı');render()}catch(e){toast(e.message)}}
async function kullaniciSil(id,ka){if(!confirm(`"${ka}" kullanıcısı kalıcı olarak silinsin mi?`))return;try{await yonet({islem:'sil',id});toast('Kullanıcı silindi');render()}catch(e){toast(e.message)}}
async function editSube(id){const s=id?SUBELER.find(x=>x.id===id):{};const o=await form(id?'Şubeyi düzenle':'Yeni şube',[{k:'kod',l:'Şube kodu',req:true},{k:'ad',l:'Şube adı',req:true},{k:'sehir',l:'Şehir'},{k:'ax_bayi_kodu',l:'AX bayi / şirket kodu'}],s);if(!o)return;
  const {error}=id?await sb.from('subeler').update(o).eq('id',id):await sb.from('subeler').insert(o);toast(error?error.message:'Kaydedildi');await loadSubeler();render()}
async function setProf(id,u){const {error}=await sb.from('profiller').update(u).eq('id',id);toast(error?error.message:'Güncellendi')}

/* ---------- common ---------- */
async function save(t,o){for(const k of['tutar','sayilan_nakit','pos_toplam_slip','adet'])if(o[k]!=null)o[k]=+String(o[k]).replace(',','.');
  const {error}=await sb.from(t).insert(o);toast(error?(error.code==='23505'?'Bu kayıt zaten var':error.message):'Kaydedildi');if(!error)render()}
async function delRow(t,id){if(!confirmInline())return;const {error}=await sb.from(t).delete().eq('id',id);toast(error?error.message:'Silindi');render()}
function confirmInline(){return window.confirm('Kayıt silinsin mi?')}
function xlsxOut(rows,name){const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,name);XLSX.writeFile(wb,`${name}_${today()}.xlsx`)}
function normDate(v){if(v==null||v==='')return null;if(typeof v==='number'){return iso(new Date(Math.round((v-25569)*864e5)))}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:null}
function normNum(v){if(typeof v==='number')return v;const s=String(v??'').replace(/[^\d,.-]/g,'');return +(s.includes(',')?s.replace(/\./g,'').replace(',','.'):s)||0}
const MAPV={tur:{'giriş':'giris','giris':'giris','tahsil':'giris','çıkış':'cikis','cikis':'cikis','ödeme':'cikis','satış':'satis_fatura','fatura':'satis_fatura','tahsilat':'tahsilat','iade':'iade'},
 odeme_tipi:{nakit:'nakit',kredi:'kredi_karti',kart:'kredi_karti',pos:'kredi_karti',havale:'havale',eft:'havale','çek':'cek',cek:'cek',senet:'senet'},
 durum:{bekl:'bekliyor',plan:'planlandi',yol:'yolda',teslim:'teslim_edildi',iade:'iade',iptal:'iptal'}};
function mapEnum(k,v){if(!MAPV[k]||v==null)return v;const s=String(v).toLocaleLowerCase('tr');for(const[a,b]of Object.entries(MAPV[k]))if(s.includes(a))return b;return null}
function importFile(table,map){
  const inp=document.createElement('input');inp.type='file';inp.accept='.xlsx,.xls,.csv';
  inp.onchange=async()=>{const sid=$('#fsube').value||ME.sube_id;if(!sid){toast('Önce üstten bir şube seçin');return}
    const wb=XLSX.read(await inp.files[0].arrayBuffer(),{cellDates:false});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null});
    if(!rows.length){toast('Dosyada satır bulunamadı');return}
    const heads=Object.keys(rows[0]),find=al=>heads.find(h=>al.includes(h.toLocaleLowerCase('tr').trim()));
    const cols=Object.fromEntries(Object.entries(map).map(([k,al])=>[k,find(al)]));
    const out=rows.map(r=>{const o={sube_id:sid,kaynak:'manuel'};for(const[k,h]of Object.entries(cols)){if(!h)continue;let v=r[h];
      if(['tarih','vade_tarihi'].includes(k))v=normDate(v);else if(['tutar','adet'].includes(k))v=normNum(v);else v=mapEnum(k,v)??(MAPV[k]?undefined:v);if(v!==undefined)o[k]=v}
      if(table==='kasa_hareketleri'){o.tur=o.tur||(o.tutar<0?'cikis':'giris');o.tutar=Math.abs(o.tutar||0);o.odeme_tipi=o.odeme_tipi||'nakit'}
      if(table==='cari_hareketler'){o.tur=o.tur||'satis_fatura';o.cari_ad=o.cari_ad||o.cari_kod||'Bilinmeyen'}
      if(table==='sevkiyatlar'){o.durum=o.durum||'bekliyor';o.adet=Math.round(o.adet||1)}
      return o}).filter(o=>o.tarih);
    if(!out.length){toast('Tarih sütunu bulunamadı. Sütunlar: '+heads.join(', '));return}
    const {error}=await sb.from(table).insert(out);toast(error?'Hata: '+error.message:`${out.length} kayıt içe aktarıldı`);if(!error)render()};
  inp.click()}
</script>
