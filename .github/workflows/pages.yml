name: GitHub Pages yayını
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Simgeleri base64'ten PNG'ye çevir
        run: for f in icons/*.b64; do base64 -d "$f" > "${f%.b64}"; done
      - name: Yayın klasörünü hazırla
        run: |
          mkdir -p _site/icons
          cp index.html manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/
          [ -f CNAME ] && cp CNAME _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
