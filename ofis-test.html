<!doctype html><html><head><meta charset=utf-8><style>
:root{
  color-scheme:light;
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --line:#D9E1DF; --line-2:#E7ECEB;
  --ink:#15201E; --ink-2:#4C5C59; --ink-3:#7B8B88;
  --accent:#0E5A55; --accent-2:#DCEBE8; --on-accent:#FFFFFF;
  --in:#1D7F47; --in-bg:#E1F2E7; --out:#B83B34; --out-bg:#F8E3E1; --warn:#9A6212; --warn-bg:#F7ECD8; --xfer:#3F5E8C; --xfer-bg:#E3EAF5;
  --shadow:0 1px 2px rgba(21,32,30,.06),0 4px 16px rgba(21,32,30,.05);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;
  --bg:#0E1614; --surface:#15201E; --surface-2:#1A2623; --line:#2A3835; --line-2:#22302D;
  --ink:#E6EEEC; --ink-2:#A8B8B5; --ink-3:#778985;
  --accent:#5FC2B8; --accent-2:#1D3834; --on-accent:#0B1A18;
  --in:#5BCB8A; --in-bg:#173023; --out:#F08279; --out-bg:#3A1F1D; --warn:#E3AE5B; --warn-bg:#35291A; --xfer:#8FAEE0; --xfer-bg:#1E2839;
  --shadow:0 1px 2px rgba(0,0,0,.3);}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:16px;box-shadow:var(--shadow)}
.login-card h1{font-size:26px}
.login-card p{margin:0;color:var(--ink-2);font-size:13px}
.mark{width:40px;height:40px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:20px}

/* giriş — iki bölmeli */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);background:var(--bg)}
.auth-side{position:relative;overflow:hidden;color:#EAF4F2;background:#0B3F3B;background-image:radial-gradient(120% 80% at 0% 0%,#14706A 0%,rgba(20,112,106,0) 60%),radial-gradient(90% 70% at 100% 100%,#082E2B 0%,rgba(8,46,43,0) 70%);padding:40px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-side::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px;mask-image:linear-gradient(180deg,#000 0%,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 85%);pointer-events:none}
.auth-side>*{position:relative}
.auth-brand{display:flex;align-items:center;gap:12px}
.auth-brand .mark{background:#F2B544;color:#0B3F3B;width:44px;height:44px;border-radius:12px;font-size:22px}
.auth-brand b{display:block;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:-.01em;color:#fff}
.auth-brand span{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#9FCBC5}
.auth-hero h2{font-size:clamp(30px,3.4vw,46px);line-height:1.08;font-weight:700;color:#fff;max-width:14ch}
.auth-hero h2 em{font-style:normal;color:#F2B544}
.auth-hero p{margin:16px 0 0;max-width:44ch;color:#BFDCD8;font-size:15px;line-height:1.6}
.auth-art{width:100%;max-width:440px;height:auto;display:block;margin-top:28px}
.auth-foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.auth-chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:13px;color:#E3F1EF}
.auth-chip i{width:7px;height:7px;border-radius:50%;background:#5BD39A;box-shadow:0 0 0 3px rgba(91,211,154,.18)}
.auth-note{width:100%;margin-top:6px;font-size:12px;color:#86B4AE}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.auth-form h1{font-size:30px;font-weight:700}
.auth-form .lead{margin:6px 0 0;color:var(--ink-2);font-size:14px}
.auth-form .field input{padding:12px 12px;font-size:15px;border-radius:10px;background:var(--surface)}
.auth-form .field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:64px!important}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--accent);font-size:13px;font-weight:600;padding:6px 8px;border-radius:6px}
.pw-toggle:hover{background:var(--accent-2)}
.auth-form .btn.primary{padding:13px 16px;font-size:15px;border-radius:10px;font-weight:600}
.auth-help{font-size:13px;color:var(--ink-3);text-align:center;margin:0}
.auth-copy{font-size:12px;color:var(--ink-3);text-align:center;margin:8px 0 0}
@media (max-width:860px){
  .auth{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .auth-side{padding:24px 20px 28px;gap:18px}
  .auth-hero h2{font-size:26px;max-width:none}
  .auth-hero p{font-size:14px;margin-top:8px}
  .auth-art,.auth-note{display:none}
  .auth-main{padding:28px 16px 40px;align-items:flex-start}
}

/* uygulama kabuğu: sol menü + içerik */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.shell.solo{grid-template-columns:minmax(0,1fr)}
.shell.solo .side,.shell.solo .nav-btn{display:none}
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;background:#0B3F3B;background-image:radial-gradient(120% 50% at 0% 0%,#14706A 0%,rgba(20,112,106,0) 70%);color:#CFE6E2;display:flex;flex-direction:column;padding:18px 12px;gap:18px;z-index:20}
.side-brand{display:flex;align-items:center;gap:10px;padding:2px 8px}
.side-brand .mark{background:#F2B544;color:#0B3F3B;width:36px;height:36px;border-radius:10px;font-size:18px;flex:none}
.side-brand b{display:block;font-family:var(--display);font-size:15px;font-weight:700;color:#fff;line-height:1.2}
.side-brand span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8FC0B9}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#7FAEA8;padding:14px 10px 6px}
.nav-h:first-child{padding-top:0}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#D5EAE6;padding:9px 10px;border-radius:8px;font-weight:500;text-align:left}
.nav-i svg{width:18px;height:18px;flex:none;opacity:.8}
.nav-i:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-i[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 #F2B544}
.nav-i[aria-current="page"] svg{opacity:1;color:#F2B544}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#8FC0B9}
.side-scrim{display:none}
.body-col{min-width:0;display:flex;flex-direction:column}
.body-col>.wrap{width:100%}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);margin-top:calc(-1 * env(safe-area-inset-top,0px))}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.nav-btn{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;flex:none}
.nav-btn svg{width:20px;height:20px}
.ttl{min-width:0;flex:1}
.ttl h1{font-size:20px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl small{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:.02em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.solo-brand{display:none;align-items:center;gap:10px}
.shell.solo .solo-brand{display:flex}
.solo-brand .mark{width:34px;height:34px;border-radius:9px;font-size:17px;background:#0B3F3B;color:#F2B544}
.who-btn{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-2);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;max-width:86vw;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
  .shell.nav-open .side{transform:none;visibility:visible;transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.3)}
  .shell.nav-open .side-scrim{display:block;position:fixed;inset:0;background:rgba(5,20,18,.45);z-index:15}
  .nav-btn{display:inline-flex}
  .nav-i{padding:11px 10px}
}
@media (max-width:520px){.who-btn #whoName{display:none}.who-btn{padding:5px}.ttl h1{font-size:18px}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--out)}
.btn.danger.armed{background:var(--out);border-color:var(--out);color:#fff}
.btn.block{width:100%}

main{display:flex;flex-direction:column;gap:20px;padding-top:20px}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{background:var(--out-bg);color:var(--out)}
.banner.info{background:var(--accent-2);color:var(--accent)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi+.kpi{border-left:1px solid var(--line-2)}
.kpi label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
.kpi .v{font-size:22px;font-weight:500;overflow-wrap:anywhere}
.kpi .s{font-size:12px;color:var(--ink-2)}
.pos{color:var(--in)} .neg{color:var(--out)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line-2)}}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2.eq{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panel-h h2{font-size:17px;font-weight:700}
.panel-h .meta{font-size:12px;color:var(--ink-3)}
.muted{color:var(--ink-3)}
.empty{padding:18px;text-align:center;color:var(--ink-3);border:1px dashed var(--line);border-radius:8px;font-size:13px}
.group-h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--ink-3);padding:6px 0}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:11px;fill:var(--ink-3)}
.insight{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.insight b{font-family:var(--mono);font-weight:500;color:var(--ink)}

.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2);cursor:pointer}
.row:first-child{border-top:0}
.dt{width:44px;text-align:center;line-height:1.1}
.dt b{display:block;font-family:var(--mono);font-size:16px;font-weight:500}
.dt span{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.dt.late b{color:var(--out)}
.who{min-width:0}
.who .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .m{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chip{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;display:inline-block}
.chip.in{background:var(--in-bg);color:var(--in)} .chip.out{background:var(--out-bg);color:var(--out)}
.chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.xfer{background:var(--xfer-bg);color:var(--xfer)}
.chip.late{background:var(--out);color:#fff}
.strike{text-decoration:line-through;opacity:.55}
#ipForm{max-width:680px}#ipForm td{white-space:normal;padding:8px 8px}#ipForm td.r{white-space:nowrap}
.ip-q{width:46px;text-align:right;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:4px 6px}
.chip.adm{background:var(--accent-2);color:var(--accent)}
.chip.off{background:var(--surface-2);color:var(--ink-3)}

.accts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.acct{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.acct .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.acct .n{font-weight:600}
.acct .b{font-size:20px}
.acct .foot{display:flex;gap:6px;margin-top:4px}
.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line-2);font-size:13px}
.mini:first-child{border-top:0}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
.filters input{flex:1 1 180px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;background:var(--surface-2)}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td .desc{max-width:260px;overflow:hidden;text-overflow:ellipsis;display:block}
tfoot td{font-weight:600;background:var(--surface-2)}

.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}

.scrim{position:fixed;inset:0;background:rgba(10,18,16,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:14px;width:100%;max-width:520px;max-height:calc(100% - 20px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.sheet h3{font-size:19px}
.sheet.wide{max-width:820px}.sheet.wide>*{flex-shrink:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:500;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400}
.checks input{width:auto!important;flex:none;margin:0;padding:0}
#akForm2 input.ak-miss{outline:2px solid var(--out);background:var(--out-bg)}
.checks label{justify-content:flex-start}
.typepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px}
.typepick button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 6px;font-weight:600;font-size:13px}
.typepick button[aria-pressed="true"][data-v="gelir"]{background:var(--in-bg);border-color:var(--in);color:var(--in)}
.typepick button[aria-pressed="true"][data-v="gider"]{background:var(--out-bg);border-color:var(--out);color:var(--out)}
.typepick button[aria-pressed="true"][data-v="transfer"]{background:var(--xfer-bg);border-color:var(--xfer);color:var(--xfer)}
.actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--out);font-size:13px}
.hint{font-size:12px;color:var(--ink-3)}
@media (max-width:480px){.kpi{padding:12px 12px}.kpi .v{font-size:16.5px}}
.kasa-kpis{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.kasa-rows{display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:6px;max-width:340px}.kasa-rows .num{text-align:right}
@media (max-width:600px){.kasa-kpis{grid-template-columns:minmax(0,1fr)}.kasa-kpis>.kpi+.kpi{border-left:0;border-top:1px solid var(--line-2)}.kasa-kpis .kpi .v{font-size:20px}}
tr.clickable,td.clickable{cursor:pointer}
td.clickable:hover{background:var(--surface-2)}
.closebox{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.ktcell{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.ta{position:relative}
.ta-list{position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-height:260px;overflow:auto}
